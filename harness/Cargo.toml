[package]
name = "harness"
version.workspace = true
edition.workspace = true
description = "Benchmark and correctness harness for csv-parser"

[dependencies]
csv-parser.workspace = true
clap = { version = "4", features = ["derive"] }
csv = "1"
csv-core = "0.1"
# a comparison parser behind a feature: its SIMD parser is instantiated once per field count,
# which makes the harness take minutes longer to build
csveee = { version = "0.2", optional = true }
encoding_rs = "0.8"
libc = "0.2"
memmap2 = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[target.'cfg(target_os = "linux")'.dependencies]
perf-event2 = "0.7"

[features]
csveee = ["dep:csveee"]

[dev-dependencies]
libtest-mimic = "0.8"
proptest = "1"

[[test]]
name = "corpus"
harness = false
