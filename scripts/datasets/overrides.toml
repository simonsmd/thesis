# Manual dialect overrides that apply to all datasets.
#
# An entry for a file overrides all its dialect options specified in the dataset
# json file. Disabling quoting, escapes or comments works by omitting the
# corresponding config key. The record terminator can be "crlf" or a single byte.
# The quoting mode is either "strict" or "toggle". In strict mode the
# quotes_in_unquoted_fields options also needs to be specified.

